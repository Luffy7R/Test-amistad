<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de amistad de Ryan</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #102a43;
  color: #fff;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 22px;
  background: #183b56;
  border: 2px solid #75d5f0;
  border-radius: 18px;
}

h1 {
  text-align: center;
  color: #75d5f0;
}

.subtitle {
  text-align: center;
  color: #d9eaf2;
}

.question {
  margin: 22px 0;
  padding: 16px;
  background: #244c66;
  border-radius: 12px;
}

.question h3 {
  margin-top: 0;
}

label {
  display: block;
  margin: 12px 0;
  padding: 12px;
  background: #315d78;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
}

label:has(input:checked) {
  background: #416f8c;
  outline: 2px solid #75d5f0;
}

input {
  margin-right: 8px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #75d5f0;
  color: #102a43;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #a0e7f8;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#resultado {
  display: none;
  margin-top: 25px;
  padding: 18px;
  background: #102a43;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

.correcta {
  color: #7dffb3;
}

.incorrecta {
  color: #ffaaaa;
}
</style>
</head>

<body>

<div class="container">
  <h1>☠️ Test de amistad de Ryan ☠️</h1>

  <p class="subtitle">
    ¿Cuánto conoces realmente a Ryan? ¡Demuéstralo!
  </p>

  <form id="test"></form>

  <button id="enviar" type="button" onclick="calificar()">
    ⚓ Terminar test
  </button>

  <div id="resultado" aria-live="polite"></div>
</div>

<script>
const preguntas = [
  {
    pregunta: "¿Cuál es mi superhéroe favorito?",
    opciones: ["Luffy", "Superman", "Spiderman", "Iron Man"],
    correcta: 2
  },
  {
    pregunta: "¿Qué persona he amado más? (No cuenta la familia)",
    opciones: ["Una ex", "Messi", "Luffy", "Keiko"],
    correcta: 1
  },
  {
    pregunta: "¿Cuántas de mis mascotas fueron elegidas por mí?",
    opciones: ["1", "2", "Todas", "Ninguna"],
    correcta: 3
  },
  {
    pregunta: "¿De verdad crees que soy serrucho, infiel o el peor hombre del mundo?",
    opciones: [
      "Sí",
      "No",
      "Tal vez",
      "A mí me serruchó (di el nombre al privado)"
    ],
    correcta: 1
  },
  {
    pregunta: "Si tuviera un hij@, ¿qué me gustaría que fuera?",
    opciones: [
      "Hombre",
      "Mujer",
      "No especificado",
      "No quiere tener hij@"
    ],
    correcta: 1
  },
  {
    pregunta: "¿Qué evento del año me gusta más?",
    opciones: ["Navidad", "Cumpleaños", "Carnaval", "Halloween"],
    correcta: 2
  },
  {
    pregunta: "¿Qué cosa nunca he hecho?",
    opciones: [
      "Besar a un amigo xd",
      "Rogar",
      "Robar",
      "Pelear"
    ],
    correcta: 0
  },
  {
    pregunta: "¿Cuántas veces he llorado por amor?",
    opciones: ["1", "2", "Más de 10", "Sigo llorando"],
    correcta: 2
  },
  {
    pregunta: "Si tuviera superpoderes, ¿qué crees que haría?",
    opciones: [
      "Salvar el mundo",
      "Destruir el mundo",
      "Construir un mundo con ella",
      "Divertirme"
    ],
    correcta: 3
  },
  {
    pregunta: "¿Tengo mejor amig@ y novia?",
    opciones: [
      "Sí",
      "No",
      "Tengo mejor amig@, pero novia no",
      "Tengo novia, pero mejor amig@ no"
    ],
    correcta: 2
  }
];

const formulario = document.getElementById("test");

// Crear automáticamente las 10 preguntas
preguntas.forEach((p, i) => {
  const bloque = document.createElement("section");
  bloque.className = "question";

  const titulo = document.createElement("h3");
  titulo.textContent = `${i + 1}. ${p.pregunta}`;
  bloque.appendChild(titulo);

  p.opciones.forEach((opcion, j) => {
    const label = document.createElement("label");
    const radio = document.createElement("input");

    radio.type = "radio";
    radio.name = `pregunta${i}`;
    radio.value = j;
    radio.required = true;

    label.appendChild(radio);
    label.appendChild(document.createTextNode(opcion));

    bloque.appendChild(label);
  });

  formulario.appendChild(bloque);
});

function calificar() {
  const respuestas = [];

  // Comprobar que todas las preguntas estén respondidas
  for (let i = 0; i < preguntas.length; i++) {
    const seleccionada = document.querySelector(
      `input[name="pregunta${i}"]:checked`
    );

    if (!seleccionada) {
      alert(`¡Te falta responder la pregunta ${i + 1}!`);

      document.querySelectorAll(".question")[i].scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

      return;
    }

    respuestas.push(Number(seleccionada.value));
  }

  let puntos = 0;
  let revision = "";

  // Revisar las respuestas
  preguntas.forEach((p, i) => {
    const acierto = respuestas[i] === p.correcta;

    if (acierto) {
      puntos++;
    }

    revision += `
      <p class="${acierto ? "correcta" : "incorrecta"}">
        <strong>${i + 1}. ${p.pregunta}</strong><br>
        Tu respuesta: ${p.opciones[respuestas[i]]}<br>
        ${
          acierto
            ? "✅ ¡Respuesta correcta!"
            : "❌ Respuesta correcta: " + p.opciones[p.correcta]
        }
      </p>
    `;
  });

  // Mensaje según la puntuación
  let mensaje;

  if (puntos === 10) {
    mensaje = "🏆 ¡Perfecto! Conoces a Ryan al máximo.";
  } else if (puntos >= 8) {
    mensaje = "⚓ ¡Excelente! Conoces muy bien a Ryan.";
  } else if (puntos >= 6) {
    mensaje = "🏴‍☠️ Vas bien, pero todavía te falta conocerlo.";
  } else {
    mensaje = "💀 ¡Necesitas conocer mejor a Ryan!";
  }

  const resultado = document.getElementById("resultado");

  resultado.style.display = "block";
  resultado.innerHTML = `
    <h2>🏆 Resultado: ${puntos}/10</h2>
    <p>${mensaje}</p>
    <h3>📋 Revisión de respuestas</h3>
    ${revision}
    <button type="button" onclick="location.reload()">
      🔄 Volver a jugar
    </button>
  `;

  document.getElementById("enviar").disabled = true;

  resultado.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}
</script>

</body>
</html>
