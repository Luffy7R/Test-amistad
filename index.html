<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de amistad de Ryan</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #102a43;
  color: #fff;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 22px;
  background: #183b56;
  border: 2px solid #75d5f0;
  border-radius: 18px;
}

h1 {
  text-align: center;
  color: #75d5f0;
}

.subtitle {
  text-align: center;
  color: #d9eaf2;
}

.question {
  margin: 22px 0;
  padding: 16px;
  background: #244c66;
  border-radius: 12px;
}

.question h3 {
  margin-top: 0;
}

label {
  display: block;
  margin: 12px 0;
  padding: 12px;
  background: #315d78;
  border-radius: 8px;
  cursor: pointer;
}

label:has(input:checked) {
  background: #416f8c;
  outline: 2px solid #75d5f0;
}

input {
  margin-right: 8px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #75d5f0;
  color: #102a43;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #a0e7f8;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#resultado {
  display: none;
  margin-top: 25px;
  padding: 18px;
  background: #102a43;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

.correcta {
  color: #7dffb3;
}

.incorrecta {
  color: #ffaaaa;
}
</style>
</head>

<body>

<div class="container">
  <h1>☠️ Test de amistad de Ryan ☠️</h1>

  <p class="subtitle">
    ¿Cuánto conoces realmente a Ryan? ¡Demuéstralo!
  </p>

  <form id="test"></form>

  <button id="enviar" type="button" onclick="calificar()">
    ⚓ Terminar test
  </button>

  <div id="resultado" aria-live="polite"></div>
</div>

<script>
const preguntas = [
  {
    pregunta: "¿Superheroe favorito?",
    opciones: ["luffy", "superman", "Spiderman", "Iron man"],
    correcta: 2
  },
  {
    pregunta: "¿Persona que mas he amado? (No familia)",
    opciones: ["Una ex", "Messi", "Luffy", "Keiko"],
    correcta: 1
  },
  {
    pregunta: "¿Cuantas de mis mascotas fueron elegidas por mi?",
    opciones: ["1", "2", "todas", "Ninguna"],
    correcta: 3
  },
  {
    pregunta: "¿Crees que en verdad es serrucho, infiel o el peor hombre del mundo?",
    opciones: [
      "Si",
      "No",
      "tal vez",
      "a mi me serrucho (decir nombre al priv)"
    ],
    correcta: 1
  },
  {
    pregunta: "¿Si tuviera un hij@ que me gustaría que fuera?",
    opciones: ["hombre", "mujer", "no especificado", "no quiere tener hij@"],
    correcta: 1
  },
  {
    pregunta: "¿Que evento del año le gusta mas?",
    opciones: ["Navidad", "Cumpleaños", "Carnaval", "Hallowen"],
    correcta: 2
  },
  {
    pregunta: "Cosa que nunca hice",
    opciones: ["besar a un amigo xd", "rogar", "robar", "pelear"],
    correcta: 0
  },
  {
    pregunta: "¿Cuantas veces ah llorado por amor?",
    opciones: ["1", "2", "mas de 10", "sigue llorando"],
    correcta: 2
  },
  {
    pregunta: "¿Si tuviera superpoderes que crees que haría?",
    opciones: [
      "salvar el mundo",
      "destruir el mundo",
      "construir un mundo con ella",
      "Divertirse"
    ],
    correcta: 3
  },
  {
    pregunta: "¿Tiene mejor amig@ y novia?",
    opciones: [
      "Si",
      "No",
      "tiene mejor amig@ pero novia no",
      "tiene novia pero mejor amig@ no"
    ],
    correcta: 2
  },

  // NUEVAS PREGUNTAS (11-17)
  {
    pregunta: "¿Alguna vez rogué a alguien?",
    opciones: ["Sí", "No", "Tal vez"],
    correcta: 0
  },
  {
    pregunta: "¿Volvería con una ex?",
    opciones: ["Sí", "No", "Ya lo hice", "Recontra no"],
    correcta: 1
  },
  {
    pregunta: "¿Alguna vez me alejé de mis amigos por alguien?",
    opciones: [
      "Sí",
      "No",
      "Tal vez",
      "¿Todavía lo preguntas?"
    ],
    correcta: 1
  },
  {
    pregunta: "¿Qué me gustaría más hacer? (Uy, esas referencias... solo para conocedores)",
    opciones: [
      "Viajar a Tarapoto",
      "Vender gaseosa",
      "Ver a Messi",
      "Ninguna de las anteriores"
    ],
    correcta: 3
  },
  {
    pregunta: "¿Qué sé hacer?",
    opciones: ["De todo", "Nada", "Ni mrd", "Rogar"],
    correcta: 0
  },
  {
    pregunta: "¿Cuál es mi segundo color favorito?",
    opciones: ["Rojo", "Verde", "Turquesa", "Morado"],
    correcta: 3
  },
  {
    pregunta: "¿Qué me gusta leer?",
    opciones: [
      "Revistas científicas",
      "Manga",
      "Periódico",
      "Mensajes de su ex"
    ],
    correcta: 0
  }
];

const formulario = document.getElementById("test");

// Mostrar las 17 preguntas
preguntas.forEach((p, i) => {
  const bloque = document.createElement("section");
  bloque.className = "question";

  const titulo = document.createElement("h3");
  titulo.textContent = `${i + 1}. ${p.pregunta}`;
  bloque.appendChild(titulo);

  p.opciones.forEach((opcion, j) => {
    const label = document.createElement("label");
    const radio = document.createElement("input");

    radio.type = "radio";
    radio.name = `pregunta${i}`;
    radio.value = j;
    radio.required = true;

    label.appendChild(radio);
    label.appendChild(document.createTextNode(opcion));
    bloque.appendChild(label);
  });

  formulario.appendChild(bloque);
});

function calificar() {
  const respuestas = [];

  for (let i = 0; i < preguntas.length; i++) {
    const seleccionada = document.querySelector(
      `input[name="pregunta${i}"]:checked`
    );

    if (!seleccionada) {
      alert(`¡Te falta responder la pregunta ${i + 1}!`);

      document.querySelectorAll(".question")[i].scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

      return;
    }

    respuestas.push(Number(seleccionada.value));
  }

  let puntos = 0;
  let revision = "";

  preguntas.forEach((p, i) => {
    const acierto = respuestas[i] === p.correcta;

    if (acierto) puntos++;

    revision += `
      <p class="${acierto ? "correcta" : "incorrecta"}">
        <strong>${i + 1}. ${p.pregunta}</strong><br>
        Tu respuesta: ${p.opciones[respuestas[i]]}<br>
        ${
          acierto
            ? "✅ ¡Correcto!"
            : "❌ Respuesta correcta: " + p.opciones[p.correcta]
        }
      </p>
    `;
  });

  let mensaje;

  if (puntos === preguntas.length) {
    mensaje = "🏆 ¡Perfecto! Conoces a Ryan al máximo.";
  } else if (puntos >= 14) {
    mensaje = "⚓ ¡Excelente! Conoces muy bien a Ryan.";
  } else if (puntos >= 10) {
    mensaje = "🏴‍☠️ Vas bien, pero todavía te falta conocerlo.";
  } else {
    mensaje = "💀 ¡Necesitas conocer mejor a Ryan!";
  }

  const resultado = document.getElementById("resultado");

  resultado.style.display = "block";
  resultado.innerHTML = `
    <h2>🏆 Resultado: ${puntos}/${preguntas.length}</h2>
    <p>${mensaje}</p>
    <h3>📋 Revisión de respuestas</h3>
    ${revision}
    <button type="button" onclick="location.reload()">
      🔄 Volver a jugar
    </button>
  `;

  document.getElementById("enviar").disabled = true;

  resultado.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}
</script>

</body>
</html>
