<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17142b">
  <title>Test de amistad de Ryan 💙</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #17142b, #29245b, #174c70);
      color: white;
      min-height: 100vh;
    }

    .contenedor {
      width: 100%;
      max-width: 800px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 18px 5px;
    }

    h1 {
      font-size: clamp(27px, 6vw, 42px);
      margin-bottom: 10px;
    }

    header p {
      color: #d8d9ff;
      line-height: 1.6;
    }

    .progreso-contenedor {
      margin: 18px 0 24px;
    }

    .progreso-texto {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      color: #e0e4ff;
    }

    .barra {
      height: 9px;
      background: #454367;
      border-radius: 20px;
      overflow: hidden;
    }

    #barraProgreso {
      height: 100%;
      width: 0%;
      background: #7de3ff;
      border-radius: 20px;
      transition: width 0.25s;
    }

    .pregunta {
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 17px;
    }

    .pregunta h2 {
      font-size: 19px;
      line-height: 1.5;
      margin: 0 0 15px;
    }

    .numero {
      color: #7de3ff;
      font-weight: bold;
    }

    .opcion {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px;
      margin: 9px 0;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: rgba(10,10,30,0.22);
      cursor: pointer;
      line-height: 1.45;
    }

    .opcion:hover {
      background: rgba(125,227,255,0.12);
      border-color: #7de3ff;
    }

    .opcion input {
      margin-top: 3px;
      flex-shrink: 0;
      accent-color: #7de3ff;
      width: 17px;
      height: 17px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    .principal {
      background: #7de3ff;
      color: #15152d;
      width: 100%;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #resultado {
      display: none;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      padding: 22px;
      margin: 25px 0;
      overflow-wrap: anywhere;
    }

    #resultado h2 {
      color: #7de3ff;
    }

    .revision {
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      line-height: 1.7;
    }

    .correcta {
      color: #8dffb2;
    }

    .incorrecta {
      color: #ffaaaa;
    }

    .aviso {
      font-size: 13px;
      color: #c5c8ed;
      text-align: center;
      line-height: 1.5;
      margin: 20px 0;
    }

    .pie {
      text-align: center;
      font-size: 13px;
      color: #c5c8ed;
      padding: 20px 0;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .pregunta {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <header>
      <h1>💙 Test de amistad de Ryan 💙</h1>
      <p>
        ¿Cuánto me conoces de verdad?<br>
        Responde las 17 preguntas y descubre tu puntuación.
      </p>
    </header>

    <div class="progreso-contenedor">
      <div class="progreso-texto">
        <span id="contador">0 de 17 respondidas</span>
        <span>17 preguntas</span>
      </div>

      <div
        class="barra"
        role="progressbar"
        aria-label="Progreso del test"
        aria-valuemin="0"
        aria-valuemax="17"
        aria-valuenow="0"
        id="barraContenedor"
      >
        <div id="barraProgreso"></div>
      </div>
    </div>

    <form id="formulario">
      <div id="listaPreguntas"></div>

      <button type="submit" class="principal" id="botonTerminar">
        Terminar test y ver resultado
      </button>
    </form>

    <p class="aviso">
      🔒 Tu progreso se guarda en este navegador.
      Actualizar la página no borrará tus respuestas.
    </p>

    <section id="resultado" aria-live="polite" tabindex="-1"></section>

    <div class="pie">
      Hecho con 💙 para poner a prueba tu amistad con Ryan.
    </div>
  </main>

  <script>
    "use strict";

    const preguntas = [
      {
        pregunta: "¿Superhéroe favorito?",
        opciones: ["Luffy", "Superman", "Spiderman", "Iron Man"],
        correcta: 2
      },
      {
        pregunta: "¿Persona que más he amado? (No familia)",
        opciones: ["Una ex", "Messi", "Luffy", "Keiko"],
        correcta: 1
      },
      {
        pregunta: "¿Cuántas de mis mascotas fueron elegidas por mí?",
        opciones: ["1", "2", "Todas", "Ninguna"],
        correcta: 3
      },
      {
        pregunta: "¿Crees que en verdad es serrucho, infiel o el peor hombre del mundo?",
        opciones: [
          "Sí",
          "No",
          "Tal vez",
          "A mí me serruchó (decir nombre al priv)"
        ],
        correcta: 1
      },
      {
        pregunta: "Si tuviera un hij@, ¿qué me gustaría que fuera?",
        opciones: [
          "Hombre",
          "Mujer",
          "No especificado",
          "No quiere tener hij@"
        ],
        correcta: 1
      },
      {
        pregunta: "¿Qué evento del año le gusta más?",
        opciones: ["Navidad", "Cumpleaños", "Carnaval", "Halloween"],
        correcta: 2
      },
      {
        pregunta: "Cosa que nunca hice",
        opciones: [
          "Besar a un amigo xd",
          "Rogar",
          "Robar",
          "Pelear"
        ],
        correcta: 0
      },
      {
        pregunta: "¿Cuántas veces ha llorado por amor?",
        opciones: ["1", "2", "Más de 10", "Sigue llorando"],
        correcta: 2
      },
      {
        pregunta: "Si tuviera superpoderes, ¿qué crees que haría?",
        opciones: [
          "Salvar el mundo",
          "Destruir el mundo",
          "Construir un mundo con ella",
          "Divertirse"
        ],
        correcta: 3
      },
      {
        pregunta: "¿Tiene mejor amig@ y novia?",
        opciones: [
          "Sí",
          "No",
          "Tiene mejor amig@ pero novia no",
          "Tiene novia pero mejor amig@ no"
        ],
        correcta: 2
      },
      {
        pregunta: "¿Alguna vez rogué a alguien?",
        opciones: ["Sí", "No", "Tal vez"],
        correcta: 0
      },
      {
        pregunta: "¿Volvería con una ex?",
        opciones: ["Sí", "No", "Ya lo hice", "Recontra no"],
        correcta: 1
      },
      {
        pregunta: "¿Alguna vez me alejé de mis amigos por alguien?",
        opciones: [
          "Sí",
          "No",
          "Tal vez",
          "¿Todavía lo preguntas?"
        ],
        correcta: 1
      },
      {
        pregunta: "¿Qué me gustaría más hacer? (Uy esas referencias.. solo para conocedores)",
        opciones: [
          "Viajar a Tarapoto",
          "Vender gaseosa",
          "Ver a Messi",
          "Ninguna de las anteriores"
        ],
        correcta: 3
      },
      {
        pregunta: "¿Qué sabe hacer?",
        opciones: ["De todo", "Nada", "Ni mrd", "Rogar"],
        correcta: 0
      },
      {
        pregunta: "¿Segundo color favorito?",
        opciones: ["Rojo", "Verde", "Turquesa", "Morado"],
        correcta: 3
      },
      {
        pregunta: "¿Qué le gusta leer?",
        opciones: [
          "Revistas científicas",
          "Manga",
          "Periódico",
          "Mensajes de su ex"
        ],
        correcta: 0
      }
    ];

    if (preguntas.length !== 17) {
      throw new Error("El test debe contener exactamente 17 preguntas.");
    }

    const CLAVE_TEST = "testAmistadRyan_v1";

    const formulario = document.getElementById("formulario");
    const listaPreguntas = document.getElementById("listaPreguntas");
    const contador = document.getElementById("contador");
    const barraProgreso = document.getElementById("barraProgreso");
    const barraContenedor = document.getElementById("barraContenedor");
    const resultado = document.getElementById("resultado");
    const botonTerminar = document.getElementById("botonTerminar");

    let testTerminado = false;

    function escaparHTML(texto) {
      return String(texto).replace(/[&<>"']/g, function(caracter) {
        const entidades = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };
        return entidades[caracter];
      });
    }

    function leerDatosGuardados() {
      try {
        const guardado = localStorage.getItem(CLAVE_TEST);
        return guardado ? JSON.parse(guardado) : null;
      } catch (error) {
        console.warn("No se pudieron leer los datos guardados.", error);
        return null;
      }
    }

    function obtenerRespuestas() {
      return preguntas.map((pregunta, indice) => {
        const seleccionada = formulario.querySelector(
          'input[name="pregunta' + indice + '"]:checked'
        );
        return seleccionada ? Number(seleccionada.value) : null;
      });
    }

    function guardarProgreso() {
      try {
        localStorage.setItem(CLAVE_TEST, JSON.stringify({
          respuestas: obtenerRespuestas(),
          terminado: testTerminado
        }));
      } catch (error) {
        console.warn("No se pudo guardar el progreso.", error);
      }
    }

    function actualizarProgreso() {
      const respuestas = obtenerRespuestas();
      const respondidas = respuestas.filter(
        respuesta => respuesta !== null
      ).length;

      contador.textContent = respondidas + " de 17 respondidas";
      barraProgreso.style.width = (respondidas / 17 * 100) + "%";
      barraContenedor.setAttribute("aria-valuenow", respondidas);
    }

    function crearPreguntas() {
      preguntas.forEach((item, indice) => {
        const bloque = document.createElement("section");
        bloque.className = "pregunta";

        const titulo = document.createElement("h2");
        const numero = document.createElement("span");
        numero.className = "numero";
        numero.textContent = "Pregunta " + (indice + 1) + " de 17: ";

        titulo.appendChild(numero);
        titulo.appendChild(document.createTextNode(item.pregunta));
        bloque.appendChild(titulo);

        item.opciones.forEach((opcion, indiceOpcion) => {
          const etiqueta = document.createElement("label");
          etiqueta.className = "opcion";

          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = "pregunta" + indice;
          radio.value = String(indiceOpcion);
          radio.required = true;

          radio.addEventListener("change", function() {
            actualizarProgreso();
            guardarProgreso();
          });

          const texto = document.createElement("span");
          texto.textContent = opcion;

          etiqueta.appendChild(radio);
          etiqueta.appendChild(texto);
          bloque.appendChild(etiqueta);
        });

        listaPreguntas.appendChild(bloque);
      });
    }

    function mostrarResultado() {
      const respuestas = obtenerRespuestas();

      if (respuestas.some(respuesta => respuesta === null)) {
        testTerminado = false;
        guardarProgreso();
        return;
      }

      let puntuacion = 0;
      let revisionHTML = "";

      preguntas.forEach((item, indice) => {
        const respuestaUsuario = respuestas[indice];
        const acerto = respuestaUsuario === item.correcta;

        if (acerto) puntuacion++;

        revisionHTML += `
          <div class="revision">
            <strong>${indice + 1}. ${escaparHTML(item.pregunta)}</strong><br>
            <span class="${acerto ? "correcta" : "incorrecta"}">
              ${acerto ? "✓ Correcto" : "✗ Incorrecto"}
            </span><br>
            Tu respuesta: ${escaparHTML(item.opciones[respuestaUsuario])}<br>
            Respuesta correcta: ${escaparHTML(item.opciones[item.correcta])}
          </div>
        `;
      });

      const porcentaje = Math.round(puntuacion / 17 * 100);

      let mensaje;
      if (puntuacion === 17) {
        mensaje = "¡Perfecto! ¡Conoces a Ryan de maravilla! 🏆";
      } else if (puntuacion >= 14) {
        mensaje = "¡Excelente! Conoces muy bien a Ryan. 💙";
      } else if (puntuacion >= 10) {
        mensaje = "¡Bien! Pero todavía hay cosas que aprender. 😎";
      } else if (puntuacion >= 5) {
        mensaje = "Te falta conocer un poco más a Ryan. 😂";
      } else {
        mensaje = "¡Necesitas estudiar más a Ryan! 🤣";
      }

      resultado.innerHTML = `
        <h2>🎉 ¡Test terminado!</h2>
        <p style="font-size:32px;font-weight:bold">${puntuacion} / 17</p>
        <p>${porcentaje}% de respuestas correctas.</p>
        <p>${mensaje}</p>
        <h3>Revisión de tus respuestas</h3>
        ${revisionHTML}
        <p class="aviso">
          Este test ya está terminado en este navegador.
        </p>
      `;

      resultado.style.display = "block";
      formulario.style.display = "none";
      testTerminado = true;
      guardarProgreso();
    }

    function cargarProgreso() {
      const datos = leerDatosGuardados();

      if (!datos ||
          !Array.isArray(datos.respuestas) ||
          datos.respuestas.length !== preguntas.length) {
        return;
      }

      datos.respuestas.forEach((respuesta, indice) => {
        if (respuesta === null) return;

        const opcion = Number(respuesta);

        if (!Number.isInteger(opcion) ||
            opcion < 0 ||
            opcion >= preguntas[indice].opciones.length) {
          return;
        }

        const radio = formulario.querySelector(
          'input[name="pregunta' + indice + '"][value="' + opcion + '"]'
        );

        if (radio) radio.checked = true;
      });

      actualizarProgreso();

      if (datos.terminado) {
        const respuestas = obtenerRespuestas();

        if (respuestas.every(respuesta => respuesta !== null)) {
          mostrarResultado();
        }
      }
    }

    formulario.addEventListener("submit", function(evento) {
      evento.preventDefault();

      if (testTerminado) return;

      const respuestas = obtenerRespuestas();

      if (respuestas.some(respuesta => respuesta === null)) {
        const primeraSinResponder = preguntas.findIndex(
          (pregunta, indice) => respuestas[indice] === null
        );

        const bloque = listaPreguntas.children[primeraSinResponder];
        const radio = bloque.querySelector("input");

        radio.focus();
        bloque.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

        alert("Responde las 17 preguntas antes de terminar el test.");
        return;
      }

      mostrarResultado();
      resultado.focus();
      resultado.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    });

    crearPreguntas();
    cargarProgreso();
  </script>
</body>
</html>
